<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Alumnos - Emerald Design</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        :root { --main-color: #198754; }
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border: none; border-radius: 15px; }
        .card-header { 
            border-radius: 15px 15px 0 0 !important; 
            background-color: var(--main-color) !important; 
            color: white; 
            font-weight: 600;
        }
        .btn-primary { background-color: var(--main-color); border: none; }
        .btn-primary:hover { background-color: #1e3f2f; }
        .table-hover tbody tr:hover { background-color: #e9f5ee; cursor: pointer; }
        .form-label { font-size: 0.85rem; font-weight: 600; color: #495057; }
        .badge-edit { background-color: #ffc107; color: #000; padding: 5px 10px; border-radius: 5px; font-size: 0.7rem; }
    </style>
</head>
<body>
    <div class="container py-5" id="app">
        <h2 class="text-center mb-4" style="color: #198754;">SISTEMA ACADÉMICO</h2>
        
        <div class="row g-4">
            <div class="col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-header p-3 d-flex justify-content-between align-items-center">
                        <span>{{ accion == 'nuevo' ? 'NUEVO INGRESO' : 'EDITAR REGISTRO' }}</span>
                        <span v-if="accion == 'modificar'" class="badge-edit">MODO EDICIÓN</span>
                    </div>
                    <div class="card-body p-4">
                        <form @submit.prevent="guardarAlumno" @reset.prevent="limpiarFormulario">
                            <div class="row g-3">
                                <div class="col-md-5">
                                    <label class="form-label">Código</label>
                                    <input required v-model="alumno.codigo" type="text" class="form-control" placeholder="USSS00202">
                                </div>
                                <div class="col-md-7">
                                    <label class="form-label">Nombre Completo</label>
                                    <input required v-model="alumno.nombre" type="text" class="form-control" placeholder="Juan Pérez">
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Correo Electrónico</label>
                                    <input required v-model="alumno.email" type="email" class="form-control" placeholder="ejemplo@correo.com">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Municipio</label>
                                    <input required v-model="alumno.municipio" type="text" class="form-control">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Departamento</label>
                                    <input required v-model="alumno.departamento" type="text" class="form-control">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Sexo</label>
                                    <select v-model="alumno.sexo" class="form-select" required>
                                        <option value="">Elegir...</option>
                                        <option value="Masculino">Masculino</option>
                                        <option value="Femenino">Femenino</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Fecha Nac.</label>
                                    <input required v-model="alumno.fechaNacimiento" type="date" class="form-control">
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Dirección</label>
                                    <textarea required v-model="alumno.direccion" class="form-control" rows="2"></textarea>
                                </div>
                            </div>

                            <div class="mt-4 d-grid gap-2 d-md-flex justify-content-md-end">
                                <button type="reset" class="btn btn-light border">LIMPIAR</button>
                                <button type="submit" class="btn btn-primary px-4">
                                    {{ accion == 'nuevo' ? 'GUARDAR' : 'ACTUALIZAR' }}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="card shadow-sm h-100">
                    <div class="p-3 border-bottom">
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted">Buscar</span>
                            <input type="search" @keyup="obtenerAlumnos()" v-model="buscar" 
                                   placeholder="Buscar por nombre o código..." class="form-control border-start-0 shadow-none">
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light text-secondary small uppercase">
                                <tr>
                                    <th class="ps-4">ALUMNO</th>
                                    <th>UBICACIÓN</th>
                                    <th>CONTACTO</th>
                                    <th class="text-end pe-4">ACCIÓN</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr v-for="item in alumnos" :key="item.id" @click="modificarAlumno(item)">
                                    <td class="ps-4">
                                        <div class="fw-bold text-dark">{{ item.nombre }}</div>
                                        <small class="text-muted">{{ item.codigo }}</small>
                                    </td>
                                    <td>
                                        <small>{{ item.municipio }}, {{ item.departamento }}</small>
                                    </td>
                                    <td>
                                        <div class="small">{{ item.email }}</div>
                                    </td>
                                    <td class="text-end pe-4">
                                        <button class="btn btn-sm btn-outline-danger" @click.stop="eliminarAlumno(item.id, $event)">
                                            Borrar
                                        </button>
                                    </td>
                                </tr>
                                <tr v-if="alumnos.length == 0">
                                    <td colspan="4" class="text-center py-5 text-muted">No se encontraron registros</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="main.js"></script>
</body>
</html>
